name: Plane Sync

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, closed]
    branches:
      - main
      - development

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-plane-ref:
    name: Validate Plane reference
    runs-on: ubuntu-latest
    if: github.event.pull_request != null && github.event.action != 'closed'
    concurrency:
      group: plane-validate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check title and body for DES-###
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const text = `${pr.title}\n${pr.body || ''}`;
            const refs = [...new Set(text.match(/\bDES-\d+\b/g) || [])];
            if (refs.length === 0) {
              core.setFailed(
                'No Plane reference found. Add `DES-###` to the PR title or body ' +
                '(e.g. `Plane: DES-92`). See .github/pull_request_template.md.'
              );
              return;
            }
            core.info(`Found Plane refs: ${refs.join(', ')}`);

  on-opened:
    name: Plane sync — opened
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request != null &&
      (github.event.action == 'opened' || github.event.action == 'reopened')
    steps:
      - uses: actions/checkout@v4
      - name: Comment + transition to In Progress
        uses: actions/github-script@v7
        env:
          PLANE_API_TOKEN: ${{ secrets.PLANE_API_TOKEN }}
          PLANE_BASE_URL: ${{ vars.PLANE_BASE_URL }}
          PLANE_WORKSPACE_SLUG: ${{ vars.PLANE_WORKSPACE_SLUG }}
          PLANE_PROJECT_ID: ${{ vars.PLANE_PROJECT_ID }}
          PLANE_TARGET_STATE: ${{ vars.PLANE_STATE_IN_PROGRESS }}
          PLANE_VERB: opened
        with:
          script: |
            const script = require('./.github/workflows/scripts/plane-sync.js');
            await script({ context, core });

  on-merged:
    name: Plane sync — merged
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request != null &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    steps:
      - uses: actions/checkout@v4
      - name: Comment + transition to Done
        uses: actions/github-script@v7
        env:
          PLANE_API_TOKEN: ${{ secrets.PLANE_API_TOKEN }}
          PLANE_BASE_URL: ${{ vars.PLANE_BASE_URL }}
          PLANE_WORKSPACE_SLUG: ${{ vars.PLANE_WORKSPACE_SLUG }}
          PLANE_PROJECT_ID: ${{ vars.PLANE_PROJECT_ID }}
          PLANE_TARGET_STATE: ${{ vars.PLANE_STATE_DONE }}
          PLANE_VERB: merged
        with:
          script: |
            const script = require('./.github/workflows/scripts/plane-sync.js');
            await script({ context, core });
